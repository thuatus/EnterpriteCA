<body>
    <h2>Submit Certificate Signing and Issue Request</h2>

    <br><br><br><br>
    <form action="/add_server_cert/" method="POST">
        <div style="display: flex; flex-direction: column; align-items: center;">
            <label class="label-main" for="serverName">Server Name:</label>
            <input type="text" id="serverName" name="serverName" placeholder="e.g. server.example.com" required>

            <button class="btn" type="submit" onclick="return confirmSubmit()" style="margin-top: 10px;">Issue Server
                Certificate</button>
            <br><br><br>
            <button class="btn" onclick="window.location.href='/'" style="margin-top: 10px;">Home</button>
        </div>
    </form>
