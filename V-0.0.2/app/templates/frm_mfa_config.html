<!--Template page do config and validate mfa user -->
<html>

<head>
    <meta charset="UTF-8">
    <title>MFA Configuration</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="/static/script/script_mfa_config.js"></script>
</head>
<header>
    <h1>EnterpriteCA</h1>
</header> 
<body>
    <h2>MFA Configuration</h2>
    <br><br>
    
    {{if not .MfaEnabled}}
    <div style="text-align: center;">
        <h3>Scan the QR Code with your Authenticator App</h3>
        <img src="{{ .MfaQrImg }}" alt="MFA QR Code">
        <p>Secret: {{.MfaSecret}}</p>
        <p>After scanning, please enter the code generated by your authenticator app to complete the setup.</p>
        <form action="" method="POST">
            <input type="text" hidden id="username" name="username" value="{{.Username}}">
            <input tyoe="text" hidden id="mfaSecret" name="mfaSecret" value="{{.MfaSecret}}">
            <input type="text" id="mfaCode" name="mfaCode" placeholder="Enter MFA Code" required>

            <button class="btn" type="submit" style="margin-top: 10px;" onclick="validateMFAToken()">Validate MFA Code</button>
        </form>
    </div>
    {{end}}
</html>
