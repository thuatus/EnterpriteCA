<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Issue Server Certificate</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        form { max-width: 600px; margin: auto; }
        label { display: block; margin-top: 15px; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; }
        button { margin-top: 20px; padding: 10px 20px; }
    </style>
</head>
<body>
    <h2>Submit Certificate Signing Request (CSR)</h2>
     
    <br><br><br><br>
    <form action="/add_server_cert/" method="POST">
        <label for="serverName">Server Name:</label>
        <input type="text" id="serverName" name="serverName" placeholder="e.g. server.example.com" required>

    <button type="submit" onclick="return confirmSubmit()">Issue Server Certificate</button>
    <script>
        function confirmSubmit() {
            // retund aks with site name confirmation
            var serverName = document.getElementById('serverName').value;
            if (!serverName) {
                alert('Please enter a server name.');
                return false;
            }
            // Confirm with the user
            if (serverName.length < 3) {
                alert('Server name must be at least 3 characters long.');
                return false;
            }
            if (!/^[a-zA-Z0-9.-]+$/.test(serverName)) {
                alert('Server name can only contain letters, numbers, dots, and hyphens.');
                return false;
            }
            if (!serverName.endsWith('.com') &&
                !serverName.endsWith('.org') &&
                !serverName.endsWith('.net')) {
                alert('Server name must end with .com, .org, or .net.');
                return false;
            }
            // If all checks pass, confirm submission
            if (confirm('Are you sure you want to issue a certificate for ' + serverName + '?')) {
                return true;
            }
            // If user cancels, prevent form submission
            return false;
        }

    </script>
    </form>
    <br><br>
    
    <strong>Issuer: </strong> {{.Issuer}} <br>
    <strong>CA Subject:</strong> {{.Subject}} <br>
    <strong>Country:</strong> {{.Country}} <br>
    <strong>State:</strong>{{.State}}<br>
    <strong>Locality: </strong>{{.Locality}} <br>
    <strong>Organization:</strong>  {{.Organization}} <br>
    <strong>Organizational Unit:</strong> {{.OrganizationalUnit}} <br>
    
</body>
</html>
