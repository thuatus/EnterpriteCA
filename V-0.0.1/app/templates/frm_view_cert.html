<!--Form that receives the content of server certificate, show in a field readonly-->
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h2 align="center">View Server Certificate</h2>
            <form>
                <div class="form-group" align="center">
                    <br>
                    <label for="servercertificate">Server Certificate</label><br>
                    <textarea class="form-control" id="servercertificate" rows="10" readonly>{{ .ServerKey }}</textarea>
                
                <!--show disclaimer with the message "save the content of certificate in a file lile server.cert"-->
                
                    <p class="text-danger">Disclaimer: Please save the content of the certificate in a file like <code>server.cert</code>. </p>
                    <button type="button" class="btn btn-primary" onclick="window.close">Close</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
    // Optional: Add any JavaScript functionality if needed
    document.addEventListener('DOMContentLoaded', function() {
        // Example: You can add functionality to copy the key to clipboard
        const servercertificate = document.getElementById('servercertificate');
        servercertificate.addEventListener('click', function() {
            servercertificate.select();
            document.execCommand('copy');
            alert('Server Certificate copied to clipboard!');
        });
    });
</script>
<!-- End of frm_view_key.html -->
