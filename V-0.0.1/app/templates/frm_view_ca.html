<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Certificate Information</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .search-box { margin-bottom: 15px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        tr.hide { display: none; }

        .modal {
      display: none;
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #444;
      z-index: 1000;
      width: 15%;
      height: 20%;
      overflow-y: auto;

    }
    .overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
    }
    .btn {
      padding: 8px 12px;
      margin-top: 10px;
      border: none;
      border-radius: 4px;
      background: #0078D7;
      color: white;
      cursor: pointer;
    }

    </style>
</head>
<body>
    <h2>Certificate Information</h2>
    <div class="search-box">
        <label for="searchInput">Search:</label>
        <input type="text" id="searchInput" placeholder="Type to search...">
    </div>
    <table id="certTable">
        <thead>
            <tr>
             <!--   <th>Application</th> -->
                <th>Subject</th>
                <th>Issued Date</th>
                <th>Expiry Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            
             {{range .}}
            <tr>
             
                <td>{{.Subject}}</td>
                <td>{{.Created}}</td>
                <td>{{.Expire}}</td>
                <td>{{.Status}}</td>
                <td>
    
                    <!-- Open a windows with a cert information -->
                    <button onclick="alert('{{.PublicKey}}')">View Certificate</button>

                    <button onclick="showModal()">View Certificate </button>
                    <div class="overlay" id="overlay" onclick="closeModal()"></div>
                    <div class="modal" id="modal">
                    <p><strong>Public Key:</strong></p>
                    <pre id="publicKeyText">{{.PublicKey}}}}</pre>
                    <button class="btn" onclick="copyKey()">Copiar chave</button>
                </div>




                    <button onclick="alert('View Private Key')">View Key</button>
                    <button onclick="alert('Revoke Certificate')">Revoke Certificate</button>
                </td>
            </tr>
            {{end}}


            <!-- Add more rows as needed -->
        </tbody>
    </table>
    <!-- include button to back to /-->
    <div align="center" style="margin-top: 20px;">
        <button onclick="window.location.href='/'">Home</button>
    </div>
    <script>
        // This script is for the search functionality
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('searchInput');
            searchInput.focus();
        });
    
        const searchInput = document.getElementById('searchInput');
        const table = document.getElementById('certTable').getElementsByTagName('tbody')[0];

        searchInput.addEventListener('keyup', function() {
            const filter = searchInput.value.toLowerCase();
            const rows = table.getElementsByTagName('tr');
            for (let i = 0; i < rows.length; i++) {
                const rowText = rows[i].textContent.toLowerCase();
                rows[i].classList.toggle('hide', !rowText.includes(filter));
            }
        });

          function showModal() {
    document.getElementById('modal').style.display = 'block';
    document.getElementById('overlay').style.display = 'block';
  }

  function closeModal() {
    document.getElementById('modal').style.display = 'none';
    document.getElementById('overlay').style.display = 'none';
  }

  function copyKey() {
    const text = document.getElementById('publicKeyText').innerText;
    navigator.clipboard.writeText(text).then(() => {
      alert('Chave copiada para a área de transferência!');
    });
  }

    </script>
</body>
</html>
