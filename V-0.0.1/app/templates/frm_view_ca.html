<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Certificate Information</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .search-box { margin-bottom: 15px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        tr.hide { display: none; }
    </style>
</head>
<body>
    <h2>Certificate Information</h2>
    <div class="search-box">
        <label for="searchInput">Search:</label>
        <input type="text" id="searchInput" placeholder="Type to search...">
    </div>
    <table id="certTable">
        <thead>
            <tr>
             <!--   <th>Application</th> -->
                <th>Subject</th>
                <th>Issued Date</th>
                <th>Expiry Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            
             {{range .}}
            <tr>
             
                <td>{{.Subject}}</td>
                <td>{{.Created}}</td>
                <td>{{.Expire}}</td>
                <td>{{.Status}}</td>
                <td>
                    <!-- Open a window with certificate options-->
                    <button onclick="showOptions('{{.PublicKey}}', 'http://localhost:8080/', 'http://localhost:8080/')">View Details</button>

                    <!-- Modal structure -->
                    <div id="optionsModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.3); align-items:center; justify-content:center;">
                        <div style="background:#fff; padding:20px; border-radius:8px; min-width:250px; max-width:90vw;">
                            <h3 id="modalTitle"></h3>
                            <button id="downloadCertBtn">Download Certificate</button>
                            <button id="downloadPubKeyBtn">Download Public Key</button>
                            <button onclick="closeModal()">Close</button>
                        </div>
                    </div>
                    <script>
                    function showOptions(subject, certUrl, pubKeyUrl) {
                        document.getElementById('modalTitle').textContent = 'Public Key\n ' + subject;
                        document.getElementById('downloadCertBtn').onclick = function() {
                            window.location.href = certUrl;
                        };
                        document.getElementById('downloadPubKeyBtn').onclick = function() {
                            window.location.href = pubKeyUrl;
                        };
                        document.getElementById('optionsModal').style.display = 'flex';
                    }
                    function closeModal() {
                        document.getElementById('optionsModal').style.display = 'none';
                    }
                    </script>
                    <button onclick="alert('View details for Certificate')">View Certificate</button>
                    <button onclick="alert('Revoke Certificate')">Revoke Certificate</button>
                </td>
            </tr>
            {{end}}


            <!-- Add more rows as needed -->
        </tbody>
    </table>
    <!-- include button to back to /-->
    <div align="center" style="margin-top: 20px;">
        <button onclick="window.location.href='/'">Home</button>
    </div>
    <script>
        // This script is for the search functionality
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('searchInput');
            searchInput.focus();
        });
    
        const searchInput = document.getElementById('searchInput');
        const table = document.getElementById('certTable').getElementsByTagName('tbody')[0];

        searchInput.addEventListener('keyup', function() {
            const filter = searchInput.value.toLowerCase();
            const rows = table.getElementsByTagName('tr');
            for (let i = 0; i < rows.length; i++) {
                const rowText = rows[i].textContent.toLowerCase();
                rows[i].classList.toggle('hide', !rowText.includes(filter));
            }
        });
    </script>
</body>
</html>
